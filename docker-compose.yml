# Stack completo del laboratorio de Blueprints: base de datos, API y cliente React.
#
# Solo la base de datos (uso habitual en desarrollo, con la API y Vite en local):
#   docker compose up -d db
#
# Stack completo (Postgres + API + cliente React servido por nginx):
#   docker compose up -d --build
#   Cliente:  http://localhost:5173
#   API:      http://localhost:8080  (Swagger en /swagger-ui.html)
#
# Detener:                       docker compose down
# Borrar todo, incluidos datos:  docker compose down -v
#
# La API crea las tablas y carga los datos de ejemplo por si misma al arrancar
# (schema.sql y data.sql), asi que la base de datos solo necesita existir vacia.

services:
  db:
    image: postgres:16-alpine
    container_name: blueprints-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: blueprints
      POSTGRES_USER: blueprints
      POSTGRES_PASSWORD: blueprints
    ports:
      - "5432:5432"
    volumes:
      - blueprints-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueprints -d blueprints"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: blueprints-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: blueprints
      DB_USER: blueprints
      DB_PASSWORD: blueprints
      # Origenes desde los que el navegador consumira la API.
      BLUEPRINTS_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      args:
        # El navegador del usuario es quien llama a la API, por eso la URL
        # apunta al puerto publicado en el host y no al nombre del servicio.
        VITE_API_BASE_URL: http://localhost:8080
        VITE_USE_MOCK: "false"
    container_name: blueprints-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  blueprints-data:
