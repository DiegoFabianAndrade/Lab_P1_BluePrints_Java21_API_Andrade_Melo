# Perfil "inmemory": ejecuta la aplicacion sin base de datos.
#
# Se usa en las pruebas automatizadas y para demostrar la API sin depender de
# PostgreSQL. Se desactiva la configuracion automatica del origen de datos para
# que el arranque no requiera un servidor de base de datos.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.sql.init.mode=never
