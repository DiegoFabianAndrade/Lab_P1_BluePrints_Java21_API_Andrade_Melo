spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ---------------------------------------------------------------------------
# PostgreSQL: implementacion de persistencia por defecto.
#
# Los valores admiten sobrescritura por variables de entorno, de modo que las
# credenciales no quedan clavadas en el codigo y el mismo artefacto sirve en
# distintos entornos (local, contenedor, evaluacion del laboratorio).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blueprints}
spring.datasource.username=${DB_USER:blueprints}
spring.datasource.password=${DB_PASSWORD:blueprints}
spring.datasource.driver-class-name=org.postgresql.Driver

# La aplicacion crea su propio esquema (schema.sql) y carga los datos de ejemplo
# (data.sql) al arrancar, asi que basta con una base de datos vacia.
spring.sql.init.mode=always
