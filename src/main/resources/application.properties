spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blueprints}
spring.datasource.username=${DB_USER:blueprints}
spring.datasource.password=${DB_PASSWORD:blueprints}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

spring.main.allow-bean-definition-overriding=true

blueprints.security.issuer=https://decsis-eci/blueprints
blueprints.security.token-ttl-seconds=3600
